name: copy-release-secrets-once

# TEMPORARY, and meant to be deleted after one run.
#
# Why this exists: a GitHub Actions secret cannot be read through the API or `gh` — the store is
# write-only. Only a workflow running inside the repository that owns a secret can read its value.
# enrich-test-api needs the same four Maven Central release secrets this repository already
# publishes with, and copying them is strictly better than minting a new Portal user token, which
# may invalidate the one this repository depends on.
#
# Before running, add SECRET_COPY_TOKEN to this repository: a short-lived fine-grained personal
# access token with "Secrets: read and write" on the target repository only.
#
# After the single run: delete this file, delete the SECRET_COPY_TOKEN secret, and revoke the token.
#
# No value is ever printed. Actions masks registered secrets in logs, and each value is passed to
# `gh` on stdin rather than as an argument, so it never appears in the runner's process list.

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Target repository, as owner/repo'
        required: true
        default: 'enrichmeai/enrich-test-api'
      confirm:
        description: 'Type "copy-secrets" to proceed'
        required: true

permissions: {}

jobs:
  copy:
    name: Copy the release secrets to the target repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check the confirmation phrase
        env:
          CONFIRM: ${{ github.event.inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "copy-secrets" ]; then
            echo "::error::confirmation phrase not matched; nothing was copied"
            exit 1
          fi

      - name: Copy the four release secrets
        env:
          GH_TOKEN: ${{ secrets.SECRET_COPY_TOKEN }}
          TARGET: ${{ github.event.inputs.target }}
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::SECRET_COPY_TOKEN is not set on this repository"
            exit 1
          fi
          missing=0
          for name in CENTRAL_USERNAME CENTRAL_PASSWORD MAVEN_GPG_PRIVATE_KEY MAVEN_GPG_PASSPHRASE; do
            value="${!name}"
            if [ -z "$value" ]; then
              echo "::error::$name is empty here, so there is nothing to copy; skipping it"
              missing=1
              continue
            fi
            # stdin, never --body: an argument would be visible in the runner's process list.
            printf '%s' "$value" | gh secret set "$name" --repo "$TARGET"
            echo "copied $name"
          done
          exit $missing

      - name: Confirm what the target now holds, by name
        env:
          GH_TOKEN: ${{ secrets.SECRET_COPY_TOKEN }}
          TARGET: ${{ github.event.inputs.target }}
        run: gh secret list --repo "$TARGET"
