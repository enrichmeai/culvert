# Publish the `culvert` distribution to PyPI via OIDC trusted publishing.
#
# AUTOMATIC ON A RELEASE (Joseph, 2026-10-02): merging the release PR is the
# human gate. Its push to main changes python-culvert/pyproject.toml, and the
# `gate` job (scripts/release/gate.py, tested by test_gate.py) releases only
# when ALL of these hold:
#   - the push changed the version, and it is plain X.Y.Z (no dev/rc suffix);
#   - it is not already on PyPI (a PyPI version is burned forever); any PyPI
#     answer other than 200/404 fails the run rather than skipping it;
#   - CHANGELOG.md has a "## [X.Y.Z]" section (the release PR wrote it);
#   - every Python package and every Java pom carries that same version.
# Any other change to pyproject.toml (a dependency bump) is a no-op.
# After PyPI accepts it, `tag` creates vX.Y.Z and a GitHub Release whose notes
# are that CHANGELOG section. The manual workflow_dispatch below still works,
# gated by the typed confirm, as the fallback; on a version already on PyPI it
# only (re)creates a missing tag and GitHub Release.
#
# The publish job runs in the `pypi` environment: protect it with required
# reviewers in repo settings if a second, click-to-approve gate is wanted.
# No tokens anywhere: PyPI trusts this exact repo + workflow + environment.
# The publish step must stay in THIS top-level workflow: trusted publishing
# does not work from a reusable workflow (pypa/gh-action-pypi-publish README).
name: publish-pypi

on:
  push:
    branches: [main]
    paths: [python-culvert/pyproject.toml]
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "publish-culvert" to confirm the irreversible PyPI publish'
        required: true

concurrency:
  group: publish-pypi
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.decide.outputs.version }}
      release: ${{ steps.decide.outputs.release }}
      tag: ${{ steps.decide.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the gate reads the version file at the push's `before` commit
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          CONFIRM: ${{ github.event.inputs.confirm }}
          BEFORE: ${{ github.event.before }}
          REF: ${{ github.ref }}
        run: >-
          python3 scripts/release/gate.py pypi --event "$EVENT" --confirm "$CONFIRM"
          --before "$BEFORE" --ref "$REF"

  verify:
    needs: gate
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --quiet build twine
          python -m build python-culvert
      - name: twine check
        run: python -m twine check python-culvert/dist/*
      - name: Clean-venv smoke (wheel, core-only)
        run: |
          python -m venv /tmp/v1 && /tmp/v1/bin/pip install --quiet python-culvert/dist/*.whl
          /tmp/v1/bin/python -c "import culvert; from data_pipeline_core import autoconfig; autoconfig.discover(); print('core-only ok', culvert.__version__)"
      - name: Clean-venv smoke (wheel[gcp] — all 9 adapters loadable)
        run: |
          python -m venv /tmp/v2
          # Install the local wheel WITH the [gcp] extra. Use the path[extra]
          # form (an absolute path) — NOT a "name @ file://<relative>" URI,
          # which pip rejects because file:// requires an absolute path.
          WHL=$(python -c "import glob,os;print(os.path.abspath(glob.glob('python-culvert/dist/*.whl')[0]))")
          /tmp/v2/bin/pip install --quiet "${WHL}[gcp]"
          /tmp/v2/bin/python -c "
          from data_pipeline_core import autoconfig
          cfg = autoconfig.discover()
          eps = ['blob_store','warehouse','finops','source','sink','secrets','observability','stage_metrics','lineage']
          missing = [n for n in eps if cfg.first(n) is None]
          assert not missing, f'unloadable adapters: {missing}'
          print('all 9 adapters loadable')"
      - name: Clean-venv smoke (sdist round-trip)
        run: |
          python -m venv /tmp/v3 && /tmp/v3/bin/pip install --quiet python-culvert/dist/*.tar.gz
          /tmp/v3/bin/python -c "import culvert; print('sdist ok', culvert.__version__)"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: python-culvert/dist/

  publish:
    needs: [gate, verify]
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # OIDC trusted publishing — no token, no secret
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  tag:
    # Tag and GitHub Release once PyPI holds the version: right after `publish`,
    # or, when the version was already on PyPI (a tag job that failed earlier),
    # on its own. A tag pushed with GITHUB_TOKEN starts no other workflow, so
    # nothing downstream may rely on it as a trigger.
    needs: [gate, publish]
    if: >-
      always() && needs.gate.result == 'success' && needs.gate.outputs.tag == 'true' &&
      (needs.publish.result == 'success' ||
       (needs.gate.outputs.release != 'true' && needs.publish.result == 'skipped'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # a manual recovery run looks up the release commit
      - name: Tag vX.Y.Z and publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG already released"; exit 0
          fi
          awk -v h="## [$VERSION]" '
            index($0, h) == 1 {on=1; next}
            on && /^## \[/ {exit}
            on {print}' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no notes under '## [$VERSION]'"; exit 1
          fi
          # On a push the release commit is this one. A manual recovery run
          # starts from main's tip, so tag the commit that set the version.
          TARGET="$GITHUB_SHA"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            TARGET=$(git log --reverse --format=%H -S"version = \"$VERSION\"" -- python-culvert/pyproject.toml | head -1)
            [ -n "$TARGET" ] || { echo "::error::no commit sets version $VERSION"; exit 1; }
          fi
          echo "tagging $TARGET"
          gh release create "$TAG" --target "$TARGET" --title "Culvert $VERSION" --notes-file notes.md
