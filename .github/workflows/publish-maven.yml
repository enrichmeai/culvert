# Publish the Java reactor to Maven Central from git.
#
# AUTOMATIC UPLOAD ON A RELEASE (Joseph, 2026-10-02): merging the release PR
# changes data-pipeline-libraries-java/pom.xml, and the `gate` job uploads the
# signed bundle only when the version is plain X.Y.Z, is not already on Maven
# Central, has a "## [X.Y.Z]" CHANGELOG section, and matches python-culvert's
# version. The upload stops at Central's VALIDATION stage: pressing "Publish" in
# the Central Portal stays a person's act (autoPublish=false, below). The manual
# workflow_dispatch with the typed confirm phrase still works as the fallback,
# with the `maven-central` environment (protect it with required reviewers for a
# second gate). Unlike PyPI, Maven Central has NO OIDC keyless publishing — this job
# needs your GPG private key and Sonatype token as GitHub SECRETS (added by you
# in repo Settings → Secrets and variables → Actions; agents never handle them):
#
#   MAVEN_GPG_PRIVATE_KEY   ASCII-armored secret key:
#                             gpg --export-secret-keys --armor <KEY_ID>
#   MAVEN_GPG_PASSPHRASE    the key's passphrase
#   CENTRAL_USERNAME        Sonatype Central portal token — username half
#   CENTRAL_PASSWORD        Sonatype Central portal token — password half
#
# The release profile uses central-publishing-maven-plugin with
# autoPublish=false, so this uploads the signed bundle to Central's VALIDATION
# stage and stops. You then review and click "Publish" at
# https://central.sonatype.com/ — the actual irreversible release. Publishing a
# version is permanent; Maven Central artifacts cannot be changed or deleted.
name: publish-maven

on:
  push:
    branches: [main]
    paths: [data-pipeline-libraries-java/pom.xml]
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "publish-maven" to upload the signed bundle to Maven Central validation'
        required: true

concurrency:
  group: publish-maven
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.decide.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          CONFIRM: ${{ github.event.inputs.confirm }}
        run: |
          set -euo pipefail
          VERSION=$(python3 -c "import xml.etree.ElementTree as E;n={'m':'http://maven.apache.org/POM/4.0.0'};print(E.parse('data-pipeline-libraries-java/pom.xml').getroot().find('m:version',n).text)")
          PY=$(python3 -c "import tomllib;print(tomllib.load(open('python-culvert/pyproject.toml','rb'))['project']['version'])")
          echo "java $VERSION, python $PY"
          release=false
          if [ "$EVENT" = "workflow_dispatch" ]; then
            [ "$CONFIRM" = "publish-maven" ] && release=true
          else
            META=$(curl -sf https://repo1.maven.org/maven2/com/enrichmeai/culvert/data-pipeline-core/maven-metadata.xml || true)
            if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "not a release version: $VERSION"
            elif [ -z "$META" ]; then
              echo "::error::could not read Maven Central metadata; not uploading blind"
              exit 1
            elif printf '%s' "$META" | grep -q "<version>$VERSION</version>"; then
              echo "$VERSION is already on Maven Central: nothing to upload"
            elif ! grep -q "^## \[$VERSION\]" CHANGELOG.md; then
              echo "::error::CHANGELOG.md has no '## [$VERSION]' section; the release PR must write it"
              exit 1
            elif [ "$PY" != "$VERSION" ]; then
              echo "::error::python-culvert is $PY but the Java parent pom is $VERSION; a release carries one version"
              exit 1
            else
              release=true
            fi
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "release: $release"

  verify:
    needs: gate
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build + sources + javadoc (no secrets — proves the bundle assembles)
        run: mvn -B -f data-pipeline-libraries-java/pom.xml clean install -DskipTests
      - name: Assert every publishable module has main + sources + javadoc
        run: |
          cd data-pipeline-libraries-java

          # Derive the version; never hardcode it. This gate previously globbed
          # *-0.1.0.jar. When the reactor moved to 0.2.0-SNAPSHOT that matched
          # nothing, so the gate reported every module as MISSING and would have
          # blocked the release at its first step.
          VERSION=$(mvn -B -q -N help:evaluate -Dexpression=project.version -DforceStdout)
          echo "reactor version: $VERSION"

          missing=0
          checked=0
          for m in */ ; do
            [ -f "$m/pom.xml" ] || continue
            grep -q '<packaging>pom</packaging>' "$m/pom.xml" && continue
            # Modules excluded from the Central bundle build no sources/javadoc
            # jars, so requiring them here would fail the gate on a module that
            # is deliberately not published (e.g. the registration-audit harness).
            if grep -q '<maven.deploy.skip>true</maven.deploy.skip>' "$m/pom.xml"; then
              echo "skip (not published to Central): $m"
              continue
            fi
            checked=$((checked + 1))
            for suffix in "" "-sources" "-javadoc"; do
              ls "$m"target/*-${VERSION}${suffix}.jar >/dev/null 2>&1 \
                || { echo "MISSING ${suffix:-main} jar in $m"; missing=1; }
            done
          done

          # A gate that checks nothing passes vacuously - the exact silent-success
          # failure this workflow exists to prevent.
          if [ "$checked" -eq 0 ]; then
            echo "ERROR: no publishable modules were checked"
            exit 1
          fi

          [ "$missing" = 0 ] && echo "OK: $checked publishable modules carry main+sources+javadoc"
          exit $missing

  deploy:
    needs: [gate, verify]
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-latest
    environment: maven-central
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - name: Deploy to Maven Central (validation stage; you confirm in the portal)
        run: mvn -B -f data-pipeline-libraries-java/pom.xml -P release clean deploy -DskipTests
        env:
          MAVEN_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
